
<!DOCTYPE html>
<html>
<head>
    <title>My Wishlist | SoleStyle</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">

    <style>
        body {
            font-family: Arial, sans-serif;
            background: #fff8f3;
            padding: 30px;
        }

        .header {
            background: #111;
            color: white;
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 {
            font-size: 25px;
        }

        .back-btn {
            text-decoration: none;
            color: white;
            background: #f4511e;
            padding: 11px 18px;
            border-radius: 5px;
            font-size: 14px;
        }

        .back-btn:hover {
            background: white;
            color: #f4511e;
        }


        h1 {
            text-align: center;
            color: #f4511e;
        }

        #wishlistItems {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }

        .product {
            background: white;
            padding: 20px;
            border-radius: 12px;
            box-shadow: 0 3px 12px #ddd;
            text-align: center;
        }

        .product img {
            width: 100%;
            height: 180px;
            object-fit: contain;
        }

        button {
            background: #f4511e;
            color: white;
            border: none;
            padding: 10px 18px;
            cursor: pointer;
            border-radius: 5px;
        }
    </style>
</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <h1>
            <i class="fa-solid fa-cart-shopping"></i>
            My Wishlist
        </h1>

        <a href="index.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
            Continue Shopping
        </a>

    </header>

    <h1>My Wishlist ❤️</h1>

    <div id="wishlistItems"></div>

    <script>
        let wishlist = JSON.parse(localStorage.getItem("wishlist")) || [];

        function displayWishlist() {
            let container = document.getElementById("wishlistItems");

            if (wishlist.length === 0) {
                container.innerHTML = "<h3>Your Wishlist is Empty ❤️</h3>";
                return;
            }

            container.innerHTML = "";

            wishlist.forEach((item, index) => {
                container.innerHTML += `
                    <div class="product">
                        <img src="${item.image}" alt="${item.name}">
                        <h3>${item.name}</h3>
                        <p>₹${item.price}</p>
                        <button onclick="removeItem(${index})">Remove</button>
                    </div>
                `;
            });
        }

        function removeItem(index) {
            wishlist.splice(index, 1);
            localStorage.setItem("wishlist", JSON.stringify(wishlist));
            displayWishlist();
        }

        displayWishlist();
    </script>

</body>
</html>
