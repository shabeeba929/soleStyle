
<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>SOLESTYLE | Cart</title>

    <link rel="stylesheet"
          href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #f7f7f7;
            color: #111;
        }

        /* HEADER */

        .header {
            background: #111;
            color: white;
            padding: 20px 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .header h1 {
            font-size: 25px;
        }

        .back-btn {
            text-decoration: none;
            color: white;
            background: #f4511e;
            padding: 11px 18px;
            border-radius: 5px;
            font-size: 14px;
        }

        .back-btn:hover {
            background: white;
            color: #f4511e;
        }

        /* CART CONTAINER */

        .cart-container {
            max-width: 1200px;
            margin: 40px auto;
            padding: 0 20px;
        }

        .cart-items {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        /* CART ITEM */

        .cart-item {
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            padding: 15px;
            display: flex;
            align-items: center;
            gap: 20px;
        }

        .cart-item img {
            width: 120px;
            height: 120px;
            object-fit: cover;
            border-radius: 6px;
        }

        .cart-info {
            flex: 1;
        }

        .cart-info h3 {
            font-size: 18px;
            margin-bottom: 8px;
        }

        .cart-price {
            color: #f4511e;
            font-size: 17px;
            font-weight: bold;
            margin-bottom: 12px;
        }

        /* QUANTITY */

        .quantity {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .quantity button {
            width: 30px;
            height: 30px;
            border: 1px solid #ddd;
            background: white;
            cursor: pointer;
            border-radius: 4px;
            font-size: 16px;
        }

        .quantity button:hover {
            background: #f4511e;
            color: white;
        }

        .quantity span {
            min-width: 25px;
            text-align: center;
            font-weight: bold;
        }

        /* REMOVE BUTTON */

        .remove-btn {
            border: none;
            background: #111;
            color: white;
            padding: 9px 14px;
            border-radius: 5px;
            cursor: pointer;
        }

        .remove-btn:hover {
            background: #f4511e;
        }

        /* ORDER SUMMARY */

        .cart-summary {
            margin-top: 30px;
            background: white;
            border: 1px solid #e5e5e5;
            border-radius: 8px;
            padding: 25px;
            max-width: 400px;
            margin-left: auto;
        }

        .cart-summary h2 {
            margin-bottom: 20px;
        }

        .summary-row {
            display: flex;
            justify-content: space-between;
            margin-bottom: 15px;
            font-size: 15px;
        }

        .summary-row.total {
            border-top: 1px solid #ddd;
            padding-top: 15px;
            font-size: 20px;
            font-weight: bold;
        }

        /* CHECKOUT BUTTON */

        .checkout-btn {
            width: 100%;
            padding: 13px;
            border: none;
            background: #f4511e;
            color: white;
            border-radius: 5px;
            font-size: 15px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 10px;
        }

        .checkout-btn:hover {
            background: #111;
        }

        /* EMPTY CART */

        .empty-cart {
            background: white;
            padding: 80px 20px;
            text-align: center;
            border-radius: 8px;
            border: 1px solid #e5e5e5;
        }

        .empty-cart i {
            font-size: 50px;
            color: #f4511e;
            margin-bottom: 20px;
        }

        .empty-cart h2 {
            margin-bottom: 10px;
        }

        .shop-btn {
            display: inline-block;
            margin-top: 20px;
            padding: 12px 22px;
            background: #111;
            color: white;
            text-decoration: none;
            border-radius: 5px;
        }

        .shop-btn:hover {
            background: #f4511e;
        }

        /* MOBILE RESPONSIVE */

        @media (max-width: 600px) {

            .header {
                padding: 18px 15px;
                gap: 10px;
            }

            .header h1 {
                font-size: 20px;
            }

            .back-btn {
                padding: 9px 10px;
                font-size: 12px;
            }

            .cart-item {
                flex-direction: column;
                align-items: flex-start;
            }

            .cart-item img {
                width: 100%;
                height: 250px;
            }

            .cart-summary {
                max-width: 100%;
            }

        }

    </style>

</head>

<body>

    <!-- HEADER -->

    <header class="header">

        <h1>
            <i class="fa-solid fa-cart-shopping"></i>
            My Cart
        </h1>

        <a href="index.html" class="back-btn">
            <i class="fa-solid fa-arrow-left"></i>
            Continue Shopping
        </a>

    </header>


    <!-- CART SECTION -->

    <main class="cart-container">

        <div id="cartItems" class="cart-items"></div>

    </main>


    <script>

        // GET CART FROM LOCAL STORAGE

        let cart = JSON.parse(localStorage.getItem("cart")) || [];

        const cartItems = document.getElementById("cartItems");


        // DISPLAY CART

        function displayCart() {

            cartItems.innerHTML = "";

            // EMPTY CART

            if (cart.length === 0) {

                cartItems.innerHTML = `

                    <div class="empty-cart">

                        <i class="fa-solid fa-cart-shopping"></i>

                        <h2>Your Cart is Empty</h2>

                        <p>
                            Add some beautiful footwear to your cart.
                        </p>

                        <a href="index.html" class="shop-btn">
                            Shop Now
                        </a>

                    </div>

                `;

                return;
            }


            // CALCULATE SUBTOTAL

            let subtotal = 0;


            // DISPLAY PRODUCTS

            cart.forEach((product, index) => {

                let price = Number(
                    String(product.price).replace(/[₹,]/g, "")
                );

                let quantity = Number(product.quantity) || 1;

                let total = price * quantity;

                subtotal += total;


                cartItems.innerHTML += `

                    <div class="cart-item">

                        <img
                            src="${product.image}"
                            alt="${product.name}"
                        >

                        <div class="cart-info">

                            <h3>${product.name}</h3>

                            <p class="cart-price">
                                ${product.price}
                            </p>

                            <div class="quantity">

                                <button onclick="decreaseQuantity(${index})">
                                    −
                                </button>

                                <span>${quantity}</span>

                                <button onclick="increaseQuantity(${index})">
                                    +
                                </button>

                            </div>

                        </div>

                        <button
                            class="remove-btn"
                            onclick="removeItem(${index})">

                            <i class="fa-solid fa-trash"></i>
                            Remove

                        </button>

                    </div>

                `;

            });


            // ORDER SUMMARY

            let delivery = 50;

            let grandTotal = subtotal + delivery;


            cartItems.innerHTML += `

                <div class="cart-summary">

                    <h2>Order Summary</h2>

                    <div class="summary-row">

                        <span>Subtotal</span>

                        <span>
                            ₹${subtotal.toLocaleString("en-IN")}
                        </span>

                    </div>

                    <div class="summary-row">

                        <span>Delivery</span>

                        <span>
                            ₹${delivery}
                        </span>

                    </div>

                    <div class="summary-row total">

                        <span>Total</span>

                        <span>
                            ₹${grandTotal.toLocaleString("en-IN")}
                        </span>

                    </div>

                    <button
                        class="checkout-btn"
                        onclick="checkout()">

                        <i class="fa-solid fa-lock"></i>
                        CHECKOUT

                    </button>

                </div>

            `;

        }


        // INCREASE QUANTITY

        function increaseQuantity(index) {

            cart[index].quantity++;

            saveCart();

        }


        // DECREASE QUANTITY

        function decreaseQuantity(index) {

            if (cart[index].quantity > 1) {

                cart[index].quantity--;

            } else {

                cart.splice(index, 1);

            }

            saveCart();

        }


        // REMOVE PRODUCT

        function removeItem(index) {

            cart.splice(index, 1);

            saveCart();

        }


        // SAVE CART

        function saveCart() {

            localStorage.setItem(
                "cart",
                JSON.stringify(cart)
            );

            displayCart();

        }


        // CHECKOUT

        function checkout() {

            if (cart.length === 0) {

                alert("Your cart is empty!");

                return;

            }

            let subtotal = cart.reduce((sum, item) => {

                let price = Number(
                    String(item.price).replace(/[₹,]/g, "")
                );

                return sum + (price * (Number(item.quantity) || 1));

            }, 0);


            let delivery = 50;

            let total = subtotal + delivery;


            // SUCCESS MESSAGE

            alert(

                "ORDER PLACED SUCCESSFULLY!\n\n" +

                "Subtotal: ₹" + subtotal.toLocaleString("en-IN") + "\n" +

                "Delivery: ₹" + delivery + "\n" +

                "Total: ₹" + total.toLocaleString("en-IN") + "\n\n" +

                "Thank you for shopping with SOLESTYLE!"

            );


            // CLEAR CART

            localStorage.removeItem("cart");

            cart = [];

            displayCart();

        }


        // INITIAL DISPLAY

        displayCart();

    </script>

</body>

</html>
